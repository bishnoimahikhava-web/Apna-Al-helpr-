<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apna AI Helper</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
.app{max-width:900px;margin:auto;min-height:100vh}.head{padding:18px 15px;background:#11182b;border-bottom:1px solid #293550;position:sticky;top:0}
.logo{font-size:23px;font-weight:bold}.sub{color:#9ba7c0;font-size:13px;margin-top:4px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
.tool{background:#151e35;color:#fff;border:1px solid #2c3958;border-radius:12px;padding:11px 5px;font-size:12px;cursor:pointer}
.chat{padding:10px 12px 125px}.msg{max-width:90%;padding:12px 14px;border-radius:16px;margin:10px 0;white-space:pre-wrap;line-height:1.5}
.user{background:#3157d5;margin-left:auto}.bot{background:#151e35;border:1px solid #293653}
.empty{text-align:center;color:#96a2ba;padding:35px 15px}.composer{position:fixed;bottom:0;left:0;right:0;background:#0b1020;border-top:1px solid #293550;padding:10px}
.row{max-width:900px;margin:auto;display:flex;gap:8px}textarea{flex:1;height:50px;resize:none;background:#151e35;color:#fff;border:1px solid #35435f;border-radius:14px;padding:13px;font-size:15px}
button{background:#4772ff;color:white;border:0;border-radius:14px;padding:0 18px;font-weight:bold}.clear{margin-top:7px;background:#27324b;padding:7px 12px;font-size:12px}
@media(max-width:600px){.tools{grid-template-columns:repeat(2,1fr)}.msg{max-width:95%}}
</style>
</head>
<body>
<div class="app">
<div class="head"><div class="logo">🤖 Apna AI Helper</div><div class="sub">पढ़ाई • लिखाई • गणित • जानकारी</div></div>
<div class="tools">
<div class="tool" onclick="p('मुझे यह सवाल आसान हिंदी में समझाओ: ')">📚 पढ़ाई</div>
<div class="tool" onclick="p('इस विषय पर एक अच्छा आवेदन लिखो: ')">✍️ आवेदन</div>
<div class="tool" onclick="p('इस गणित के सवाल को step-by-step हल करो: ')">🧮 गणित</div>
<div class="tool" onclick="p('इसका आसान सारांश बनाओ: ')">📝 सारांश</div>
<div class="tool" onclick="p('इस हिंदी को अंग्रेजी में अनुवाद करो: ')">🌐 अनुवाद</div>
<div class="tool" onclick="p('परीक्षा के लिए महत्वपूर्ण प्रश्न और उत्तर बनाओ: ')">🎯 परीक्षा</div>
<div class="tool" onclick="p('इस विषय पर अच्छा लेख लिखो: ')">📰 लेख</div>
<div class="tool" onclick="p('इस विषय की जानकारी आसान भाषा में दो: ')">💡 जानकारी</div>
</div>
<div id="chat" class="chat"><div class="empty" id="empty"><div style="font-size:42px">🤖</div><h2>नमस्ते!</h2><p>अपना सवाल लिखें या ऊपर सुविधा चुनें।</p><small>Groq Free AI लाइव हो चुका है! अपना कोई भी सवाल पूछें।</small></div></div>
<div class="composer"><div class="row"><textarea id="input" placeholder="अपना सवाल लिखें..." onkeydown="enterSend(event)"></textarea><button onclick="send()">भेजें</button></div><div class="row"><button class="clear" onclick="clearChat()">चैट साफ करें</button></div></div>
</div>

<script>
const chat=document.getElementById('chat'),input=document.getElementById('input');

const API_KEY =  "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";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

function p(t){input.value=t;input.focus()}
function add(t,c){let e=document.getElementById('empty');if(e)e.remove();let d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);window.scrollTo(0,document.body.scrollHeight)}

async function send(){
    let q=input.value.trim();
    if(!q)return;
    add(q,'user');
    input.value='';

    let loadingDiv = document.createElement('div');
    loadingDiv.className = 'msg bot';
    loadingDiv.textContent = 'सोच रहा हूँ...⏳';
    chat.appendChild(loadingDiv);
    window.scrollTo(0,document.body.scrollHeight);

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "Authorization": `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile", 
                messages: [{ role: "user", content: q }]
            })
        });
        
        const data = await response.json();
        loadingDiv.remove(); 
        
        if (data && data.choices && data.choices[0] && data.choices[0].message) {
            let aiReply = data.choices[0].message.content;
            add(aiReply, 'bot');
        } else if (data && data.error) {
            add("API Error: " + data.error.message, 'bot');
        } else {
            add("माफ़ कीजिये, अभी सही जवाब नहीं मिल पाया। कृपया पुनः प्रयास करें।", 'bot');
        }
    } catch (error) {
        loadingDiv.remove();
        add("कनेक्शन में कुछ दिक्कत आ रही है। कृपया इंटरनेट या चाबी जांचें।", 'bot');
    }
}

function enterSend(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function clearChat(){chat.innerHTML='<div class="empty" id="empty"><div style="font-size:42px">🤖</div><h2>नमस्ते!</h2><p>अपना सवाल लिखें या ऊपर सुविधा चुनें।</p></div>'}
</script>
</body>
</html>
